<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="lobby">
  <div class="card">

    <h2>🔥 ЛИТВИН: ХАЙП</h2>

    <input id="username" placeholder="Имя">
    <input id="roomCode" placeholder="Комната">

    <div class="chips">
      <div class="chip red" data-color="red"></div>
      <div class="chip blue" data-color="blue"></div>
      <div class="chip green" data-color="green"></div>
      <div class="chip yellow" data-color="yellow"></div>
    </div>

    <button id="joinBtn">Войти</button>
    <button id="startBtn">Старт</button>

    <div id="playersList"></div>

  </div>
</div>

<div id="game" style="display:none">

  <div id="hypeBars"></div>

  <div id="gameBoard"></div>

  <button id="rollBtn">🎲</button>
  <div id="diceResult"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
