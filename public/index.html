<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Литвин: Путь к хайпу</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= ЛОББИ ================= -->
<div id="lobby">

  <h1 class="title">🔥 ЛИТВИН: ПУТЬ К ХАЙПУ</h1>

  <div class="lobbyBox">

    <input id="username" placeholder="Введите имя">
    <input id="roomCode" placeholder="Код комнаты">

    <div class="chips">
      <button class="chip" data-color="red">🔴</button>
      <button class="chip" data-color="blue">🔵</button>
      <button class="chip" data-color="green">🟢</button>
      <button class="chip" data-color="yellow">🟡</button>
    </div>

    <button id="joinBtn" class="mainBtn">🚪 Войти</button>
    <button id="startBtn" class="mainBtn start">🚀 Начать игру</button>

  </div>

  <!-- 📜 ПРАВИЛА -->
  <div class="rulesBox">
    <h2>📜 Правила игры</h2>

    <p><b>Цель:</b> первым набрать <span class="highlight">70 хайпа</span></p>

    <p>🎲 Бросай кубик и двигайся</p>
    <p>➕ Бонусы дают хайп</p>
    <p>💥 Скандал — потеря хайпа</p>
    <p>⚡ Риск — шанс +5 или −5</p>
    <p>🚫 Суд — пропуск хода</p>

    <p>🔁 За круг: +7</p>
    <p>🚀 Старт: +10</p>

    <p class="winRule">🏆 Побеждает первый с 70 хайпа</p>
  </div>

</div>

<!-- ================= ИГРА ================= -->
<div id="game" style="display:none;">

  <!-- ХАЙП -->
  <div id="hypeBars"></div>

  <!-- ОГОНЬ -->
  <div class="fireLayer"></div>

  <!-- ПОЛЕ -->
  <div id="gameBoard"></div>

  <!-- УПРАВЛЕНИЕ -->
  <div id="controls">
    <button id="rollBtn">🎲 Бросить кубик</button>
    <div id="diceResult"></div>
  </div>

  <!-- МОДАЛКИ -->
  <div id="modal"></div>

</div>

<!-- ================= СКАНДАЛ ================= -->
<div id="scandalModal" class="modal">
  <div class="scandalCard">
    <div class="scandalTitle">🔥 СКАНДАЛ</div>
    <div id="scandalText"></div>
    <button onclick="closeScandal()">OK</button>
  </div>
</div>

<!-- ================= РИСК ================= -->
<div id="riskModal" class="modal">
  <div class="riskCard">
    <h2>⚡ Риск</h2>
    <p id="riskResult"></p>

    <button onclick="rollRisk()">🎲 Бросить</button>
  </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
