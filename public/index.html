<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин игра</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="lobby">

  <h1 class="title">🔥 ЛИТВИН: ПУТЬ К ХАЙПУ</h1>

  <div class="lobbyBox">

    <input id="username" placeholder="Введите имя">
    <input id="roomCode" placeholder="Код комнаты">

    <div class="chips">
      <button class="chip red" data-color="red"></button>
      <button class="chip blue" data-color="blue"></button>
      <button class="chip green" data-color="green"></button>
      <button class="chip yellow" data-color="yellow"></button>
    </div>

    <button id="joinBtn" class="btn join">🚪 Войти</button>
    <button id="startBtn" class="btn start">🚀 Начать</button>

    <div id="playersList"></div>
  </div>

</div>

<div id="game" style="display:none">

  <div id="hypeBars"></div>

  <div id="gameBoard"></div>

  <div id="controls">
    <button id="rollBtn">🎲 Кубик</button>
    <div id="diceResult"></div>
  </div>

  <!-- 💥 СКАНДАЛ -->
  <div id="scandalModal" class="modal">
    <div class="modalBox">
      <h2>💥 Скандал</h2>
      <p id="scandalText"></p>
      <button onclick="closeScandal()">OK</button>
    </div>
  </div>

  <!-- ⚡ РИСК -->
  <div id="riskModal" class="modal">
    <div class="modalBox">
      <h2>⚡ Риск</h2>
      <p id="riskResult"></p>
      <button onclick="rollRisk()">🎲 Кинуть</button>
      <button onclick="closeRisk()">Закрыть</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
