<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин игра</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== ЛОББИ ===== -->
<div id="lobby">

  <h1 class="title">🔥 ЛИТВИН: ПУТЬ К ХАЙПУ</h1>

  <div class="lobbyBox">

    <input id="username" placeholder="Введите имя">
    <input id="roomCode" placeholder="Код комнаты">

    <div class="chips">
      <button class="chip red" data-color="red"></button>
      <button class="chip blue" data-color="blue"></button>
      <button class="chip green" data-color="green"></button>
      <button class="chip yellow" data-color="yellow"></button>
    </div>

    <button id="joinBtn" class="btn join">🚪 Войти</button>
    <button id="startBtn" class="btn start">🚀 Начать игру</button>

    <div id="playersList"></div>
  </div>

  <!-- ===== ПРАВИЛА ===== -->
  <div class="rules">
    <h2>📜 Правила</h2>

    <p><b>Цель:</b> набрать 70 хайпа</p>

    <p>🎲 Бросай кубик и двигайся</p>
    <p>💥 Скандал — теряешь хайп</p>
    <p>⚡ Риск — +5 или -5</p>
    <p>⛔ Пропуск хода</p>
    <p>🔁 Круг: +7 хайпа</p>
  </div>

</div>

<!-- ===== ИГРА (НЕ ТРОГАЕМ ЛОГИКУ) ===== -->
<div id="game" style="display:none">

  <div id="hypeBars"></div>

  <div id="gameBoard"></div>

  <div id="controls">
    <button id="rollBtn">🎲 Бросить кубик</button>
    <div id="diceResult"></div>
  </div>

  <div id="modal"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
