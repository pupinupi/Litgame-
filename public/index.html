<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин Хайп</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="lobby">
  <div class="lobbyBox">

    <div class="title">🔥 ЛИТВИН GAME</div>

    <input id="username" placeholder="Имя">
    <input id="roomCode" placeholder="Комната">

    <div class="chips">
      <button class="chip red" data-color="red"></button>
      <button class="chip blue" data-color="blue"></button>
      <button class="chip green" data-color="green"></button>
      <button class="chip yellow" data-color="yellow"></button>
    </div>

    <button id="joinBtn" class="btn join">Войти</button>
    <button id="startBtn" class="btn start">Старт</button>

    <div class="rules">
      🎲 Кубик → движение<br>
      💥 Скандал → потеря хайпа<br>
      ⚡ Риск → +5 / -5<br>
      🏆 70 хайпа = победа
    </div>

  </div>
</div>

<div id="game" style="display:none">

  <div id="gameBoard"></div>

  <div id="controls">
    <button id="rollBtn">🎲 КУБИК</button>
    <div id="diceResult"></div>
  </div>

  <!-- SCANDAL -->
  <div id="scandalModal" class="modal">
    <div class="modalBox">
      <p id="scandalText"></p>
      <button onclick="closeScandal()">OK</button>
    </div>
  </div>

  <!-- RISK -->
  <div id="riskModal" class="modal">
    <div class="modalBox">
      <p id="riskResult"></p>
      <button onclick="rollRisk()">🎲</button>
      <button onclick="closeRisk()">OK</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
