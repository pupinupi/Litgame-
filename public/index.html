<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин ХАЙП</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="lobby">
  <h1 class="title">🔥 ЛИТВИН: ПУТЬ К ХАЙПУ</h1>

  <div class="lobbyBox">

    <input id="username" placeholder="Имя">
    <input id="roomCode" placeholder="Комната">

    <div class="chips">
      <button class="chip red" data-color="red"></button>
      <button class="chip blue" data-color="blue"></button>
      <button class="chip green" data-color="green"></button>
      <button class="chip yellow" data-color="yellow"></button>
    </div>

    <button id="joinBtn" class="btn join">🚪 Войти</button>
    <button id="startBtn" class="btn start">🚀 Старт</button>

    <div id="playersList"></div>

  </div>
</div>

<div id="game" style="display:none">

  <div id="hypeBars"></div>

  <div id="gameBoard"></div>

  <div id="controls">
    <button id="rollBtn">🎲 КУБИК</button>
    <div id="diceResult"></div>
  </div>

  <!-- 💥 SCANDAL -->
  <div id="scandalModal" class="modal shake">
    <div class="modalBox glowRed">
      <h2>💥 СКАНДАЛ</h2>
      <p id="scandalText"></p>
      <button onclick="closeScandal()">OK</button>
    </div>
  </div>

  <!-- ⚡ RISK -->
  <div id="riskModal" class="modal">
    <div class="modalBox glowBlue">
      <h2>⚡ РИСК</h2>
      <p id="riskResult"></p>
      <button onclick="rollRisk()">🎲 Кинуть</button>
      <button onclick="closeRisk()">Закрыть</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
