<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин игра</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lobby">
  <h2>ЛОББИ</h2>

  <input id="username" placeholder="Имя">
  <input id="roomCode" placeholder="Комната">

  <div>
    <button class="chip" data-color="red">🔴</button>
    <button class="chip" data-color="blue">🔵</button>
    <button class="chip" data-color="green">🟢</button>
    <button class="chip" data-color="yellow">🟡</button>
  </div>

  <button id="joinBtn">Войти</button>
  <button id="startBtn">Старт</button>

  <div id="playersList"></div>
</div>

<div id="game" style="display:none">
  

 <div id="hypeBars"></div>

<div id="gameBoard"></div>

<div id="controls">
  <button id="rollBtn">🎲 Бросить кубик</button>
  <div id="diceResult"></div>
</div>

<div id="modal"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>

<div id="scandalModal" class="modal">
  <div class="scandalCard">
    <div class="scandalTitle">🔥 СКАНДАЛ</div>
    <div id="scandalText"></div>
    <button onclick="closeScandal()">OK</button>
  </div>
</div>

<div id="riskModal" class="modal">
  <div class="riskCard">
    <div class="riskTitle">⚡ РИСК</div>

    <div id="riskRules">
      1–3 → −5 хайпа<br>
      4–6 → +5 хайпа
    </div>

    <div id="riskResult"></div>

    <button id="riskRollBtn" onclick="rollRisk()">🎲 Бросить</button>
    <button id="riskCloseBtn" onclick="closeRisk()" style="display:none;">OK</button>
  </div>
</div>
