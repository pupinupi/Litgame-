<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Литвин: Путь к хайпу</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= ЛОББИ ================= -->
<div id="lobby">

  <h1 class="title">🔥 ЛИТВИН: ПУТЬ К ХАЙПУ</h1>

  <div class="lobbyBox">
    <input id="username" placeholder="Введите имя">
    <input id="roomCode" placeholder="Код комнаты">

    <div class="chips">
      <button class="chip" data-color="red">🔴</button>
      <button class="chip" data-color="blue">🔵</button>
      <button class="chip" data-color="green">🟢</button>
      <button class="chip" data-color="yellow">🟡</button>
    </div>

    <button id="joinBtn" class="mainBtn">🚪 Войти</button>
    <button id="startBtn" class="mainBtn start">🚀 Начать игру</button>
  </div>

  <div class="rulesBox">
    <h2>📜 Правила</h2>
    <p>Первый, кто наберёт <b>70 хайпа</b>, побеждает.</p>
    <p>🎲 Бросай кубик</p>
    <p>💥 Скандал — теряешь хайп</p>
    <p>⚡ Риск — ±5 хайпа</p>
    <p>⛔ Пропуск хода</p>
    <p>🔁 Круг: +7</p>
    <p>🚀 Старт: +10</p>
  </div>
</div>

<!-- ================= ИГРА ================= -->
<div id="game" style="display:none;">

  <div id="hypeBars"></div>

  <div class="fireLayer"></div>
  <div id="gameBoard"></div>

  <div id="controls">
    <div id="gameStatus"></div>
    <button id="rollBtn">🎲 Бросить кубик</button>
    <div id="diceResult"></div>
  </div>
</div>

<!-- ===== СКАНДАЛ ===== -->
<div id="scandalModal" class="modal">
  <div class="scandalCard">
    <div class="scandalTitle">🔥 СКАНДАЛ</div>
    <div id="scandalText"></div>
    <button onclick="closeScandal()">OK</button>
  </div>
</div>

<!-- ===== РИСК ===== -->
<div id="riskModal" class="modal">
  <div class="riskCard">
    <div class="riskTitle">⚡ РИСК</div>
    <div id="riskRules">1–3 → −5<br>4–6 → +5</div>
    <div id="riskResult"></div>
    <button id="riskRollBtn">🎲 Бросить</button>
    <button id="riskCloseBtn" style="display:none;">OK</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
