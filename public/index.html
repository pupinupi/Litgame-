<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Литвин: Путь к хайпу</title>
<link rel="stylesheet" href="style.css">
</head>

  <audio id="bgMusic" src="music.mp3" loop></audio>

<body>

<!-- ================= ЛОББИ ================= -->
<!-- ===== ЛОББИ ===== -->
<div id="lobby">

  <h1 class="title">🔥 ЛИТВИН: ПУТЬ К ХАЙПУ</h1>

  <div class="glassLobby">

    <!-- ЛЕВАЯ ЧАСТЬ -->
    <div class="leftPanel">

      <input id="username" placeholder="Имя">
      <input id="roomCode" placeholder="Код комнаты">

      <div class="chips">
        <div class="chip red" data-color="red"></div>
        <div class="chip blue" data-color="blue"></div>
        <div class="chip green" data-color="green"></div>
        <div class="chip yellow" data-color="yellow"></div>
      </div>

      <button id="joinBtn" class="btn join">🚪 Войти</button>
      <button id="startBtn" class="btn start">🚀 Начать игру</button>

    </div>

    <!-- ПРАВАЯ ЧАСТЬ -->
    <div class="rightPanel">

      <h2>👥 Игроки</h2>
      <div id="playersList" class="playersList"></div>

      <div class="rules">
        <h3>📜 Правила</h3>
        <p>🎯 Цель: 140 хайпа</p>
        <p>🎲 Бросай кубик</p>
        <p>💥 Скандал = минус</p>
        <p>⚡ Риск = ±5</p>
        <p>⛔ Пропуск хода</p>
      </div>

    </div>

  </div>

</div>
<!-- ================= ИГРА ================= -->
<div id="game" style="display:none;">

  <!-- ХАЙП -->
  <div id="hypeBars"></div>

  <!-- ОГОНЬ -->
  <div class="fireLayer"></div>

  <!-- ПОЛЕ -->
  <div id="gameBoard"></div>

  <!-- УПРАВЛЕНИЕ -->
  <div id="controls">
    <button id="rollBtn">🎲 Бросить кубик</button>
    <div id="diceResult"></div>
  </div>

  <!-- МОДАЛКИ -->
  <div id="modal"></div>

</div>

<!-- ================= СКАНДАЛ ================= -->
<div id="scandalModal" class="modal">
  <div class="scandalCard">
    <h2>💥 Скандал</h2>
    <p id="scandalText"></p>

<button onclick="closeScandal()">OK</button>
  </div>
</div>

<!-- ================= РИСК ================= -->
<div id="riskModal" class="modal">
  <div class="riskCard">
    <h2>⚡ Риск</h2>
    <p id="riskResult"></p>

    <button onclick="rollRisk()">🎲 Бросить</button>
  </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

<div id="winScreen">
  <div class="winCard">
    <h1 id="winText">🏆 Победа</h1>
    <button onclick="restartGame()">Играть снова</button>
  </div>
</div>
  
</body>
</html>

<div id="hint"></div>
