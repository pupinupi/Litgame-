<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOBBY -->
<div id="lobby">

  <div class="lobbyBox">
    <h2>🔥 ЛИТВИН GAME</h2>

    <input id="username" placeholder="Ник">
    <input id="roomCode" placeholder="Комната">

    <button id="joinBtn">Войти в комнату</button>

    <div id="roomStatus"></div>
  </div>

</div>

<!-- GAME -->
<div id="game" style="display:none">

  <div id="playersList"></div>

  <div id="hypeBar"></div>

  <div id="gameBoard"></div>

  <button id="rollBtn">🎲 Кубик</button>
  <div id="diceResult"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
