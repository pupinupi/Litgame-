<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOBBY -->
<div id="lobby">

  <div class="glassCard">

    <div class="title">🔥 ЛИТВИН: ПУТЬ К ХАЙПУ</div>

    <input id="username" placeholder="Имя игрока">
    <input id="roomCode" placeholder="Код комнаты">

    <div class="sectionTitle">Выбери фишку</div>

    <div class="chips">
      <div class="chip red" data-color="red"></div>
      <div class="chip blue" data-color="blue"></div>
      <div class="chip green" data-color="green"></div>
      <div class="chip yellow" data-color="yellow"></div>
    </div>

    <button id="joinBtn">🚪 Войти в комнату</button>

    <div id="roomInfo"></div>

    <button id="startBtn" class="hidden">🚀 Начать игру</button>

    <div class="rules">
      🎲 Кубик — движение<br>
      💥 Скандал — потеря хайпа<br>
      ⚡ Риск — +5 / -5<br>
      🏆 70 хайпа = победа
    </div>

  </div>
</div>

<!-- GAME -->
<div id="game" style="display:none">

  <div id="playersList"></div>
  <div id="hypeBar"></div>

  <div id="gameBoard"></div>

  <button id="rollBtn">🎲 Кубик</button>
  <div id="diceResult"></div>

  <div id="coordPanel">
  <div id="coordsOutput">[]</div>
  <button onclick="copyCoords()">📋 Скопировать</button>
  <button onclick="resetCoords()">🗑 Очистить</button>
</div>
  
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
