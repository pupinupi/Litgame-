<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин Путь к Хайпу</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
  <h1>🔥 ПУТЬ К ХАЙПУ 🔥</h1>

  <input id="name" placeholder="Имя">
  <input id="room" placeholder="Комната">

  <div>
    <button onclick="setColor('red')">Красный</button>
    <button onclick="setColor('blue')">Синий</button>
    <button onclick="setColor('yellow')">Жёлтый</button>
    <button onclick="setColor('purple')">Фиолетовый</button>
  </div>

  <button onclick="join()">Войти</button>
  <button onclick="start()">Старт</button>
</div>

<div id="game" style="display:none;">
  <img id="board" src="board.jpg" width="600">

  <button onclick="rollDice()">🎲 Кубик</button>

  <div id="players"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
