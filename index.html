<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Литвин Игра</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
  <h1>🔥 ПУТЬ К ХАЙПУ 🔥</h1>

  <input id="name" placeholder="Имя">
  <input id="room" placeholder="Комната">

  <div>
    <button onclick="setColor('red')">🔴</button>
    <button onclick="setColor('blue')">🔵</button>
    <button onclick="setColor('yellow')">🟡</button>
    <button onclick="setColor('purple')">🟣</button>
  </div>

  <button onclick="join()">ВОЙТИ</button>
  <button onclick="start()">СТАРТ</button>
</div>

<div id="game" style="display:none;">
  <img id="board" src="board.jpg">
  <button onclick="rollDice()">🎲</button>
  <div id="players"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
