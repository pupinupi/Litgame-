
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Путь к хайпу</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu">
  <h1>🔥 ПУТЬ К ХАЙПУ 🔥</h1>

  <input id="name" placeholder="Имя">
  <input id="room" placeholder="Комната">

  <button onclick="setColor('red')">🔴</button>
  <button onclick="setColor('blue')">🔵</button>
  <button onclick="setColor('yellow')">🟡</button>
  <button onclick="setColor('purple')">🟣</button>

  <button onclick="join()">Войти</button>
  <button onclick="start()">Старт</button>

  <div id="playersList"></div>
  <div id="debug"></div>
</div>

<div id="game" style="display:none;">
  <div id="boardWrap">
    <img id="board" src="board.jpg">
  </div>

  <button onclick="rollDice()">🎲 Бросить</button>

  <div id="players"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
