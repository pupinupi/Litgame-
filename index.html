
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Путь к хайпу</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔥 ЛОББИ -->
<div id="menu">
  <h1>🔥 ПУТЬ К ХАЙПУ 🔥</h1>

  <input id="name" placeholder="Имя">
  <input id="room" placeholder="Комната">

  <div id="colors">
    <div onclick="setColor('red')" class="color red"></div>
    <div onclick="setColor('blue')" class="color blue"></div>
    <div onclick="setColor('yellow')" class="color yellow"></div>
    <div onclick="setColor('purple')" class="color purple"></div>
  </div>

  <button onclick="join()">Войти</button>

  <h3>Игроки:</h3>
  <div id="playersList"></div>

  <button onclick="start()">Начать игру</button>
</div>

<!-- 🎮 ИГРА -->
<div id="game" style="display:none;">
  <div id="hypeBar"><div id="hypeFill"></div></div>

  <div id="boardWrap">
    <img id="board" src="board.jpg">
  </div>

  <button onclick="rollDice()">🎲 Бросить</button>

  <div id="players"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
